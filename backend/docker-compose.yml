services:
  postgres:
    image: postgres:16-alpine
    container_name: pronto_app_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pronto_app
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
